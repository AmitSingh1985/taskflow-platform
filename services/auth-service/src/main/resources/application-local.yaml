spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow_auth
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.taskflow.auth: DEBUG