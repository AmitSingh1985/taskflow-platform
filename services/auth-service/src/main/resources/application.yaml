spring:
  application:
    name: auth-service
    security:
      jwt:
        access-token-validity-minutes: 15
        refresh-token-validity-days: 7

  profiles:
    active: local

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

    com.taskflow.auth: DEBUG

    com.common.jwt: DEBUG

jwtcred:
  secret: 9d8f7a6b5c4d3e2f1a9b8c7d6e5f4a3b9d8f7a6b5c4d3e2f1a9b8c7d6e5f4a3b
  expiration: 3600000
  
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
  