spring:
  application:
    name: project-service
  profiles:
    active: local
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
  
  elasticsearch:
    uris: ${ELASTIC_SEARCH:http://localhost:9200}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone:  ${EUREKA_SERVER:http://localhost:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        # This turns on the hidden _bucket metrics for your HTTP endpoints
        http.server.requests: true
    tags:
      application: ${spring.application.name}


    
