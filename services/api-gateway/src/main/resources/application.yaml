spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
#          routes:
#            - id: auth-service
#              uri: lb://AUTH-SERVICE
#              predicates:
#                - Path=/api/v1/auth/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone:  ${EUREKA_SERVER:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  
  endpoint:
    health:
      show-details: always
  
  metrics:
    distribution:
      percentiles-histogram:
        # This turns on the hidden _bucket metrics for your HTTP endpoints
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    org.springframework.cloud.netflix.eureka: DEBUG