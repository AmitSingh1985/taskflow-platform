    ##healthcheck:
      ##test:
        ##[
          ##"CMD-SHELL",
          ##"curl -fs http://localhost:9200/_cluster/health || exit 1"
        ##]
      ##interval: 15s
      ##timeout: 15s
      ##retries: 20
      ##start_period: 120s

  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - taskflow-network
  
  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - taskflow-network
  
  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Grafana uses this port to read traces
      - "4317"        # OTel Collector can send traces here over gRPC
    networks:
      - taskflow-network

volumes:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
networks:
  taskflow-network:
    