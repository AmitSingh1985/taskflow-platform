global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "api-gateway:8080"

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "auth-service:8081"

  - job_name: "project-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "project-service:8082"

  - job_name: "task-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "task-service:8083"